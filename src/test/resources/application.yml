spring:
  datasource:
    url: "jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  cloud:
    discovery:
      enabled: false
    consul:
      enabled: false
      discovery:
        enabled: false
        register: false
        catalog-services-watch:
          enabled: false

# La ingesta exige API key; el valor es sólo para tests.
app:
  api-key: test-key
